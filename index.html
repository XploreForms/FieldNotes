/* tab icon: when the page is shown inside another document wrapper, its <head> links can land in the body,
   where browsers skip them; copy them into the real head */
(function () {
  try {
    var h = document.head; if (!h) return;
    [].forEach.call(document.querySelectorAll('link[rel~="icon"], link[rel="apple-touch-icon"]'), function (l) {

      var c = document.createElement('link'); c.rel = l.rel; if (l.type) c.type = l.type;

  } catch (e) {}
})();
/* colour mode before the first paint: a saved Light or Dark wins, otherwise follow the phone */

})();

  --xp-font: 'Poppins', 'Segoe UI', system-ui, -apple-system, sans-serif;
}
/* Approved pairings only: on North Shore or Carmanah use Superior, Solar Wind or White text;
   on Superior or Solar Wind use North Shore text. */

html { font-size: 16px; -webkit-text-size-adjust: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); color-scheme: dark; background: var(--xp-dark); }

*, *::before, *::after { box-sizing: border-box; }

/* no double-tap zoom or tap delay when tapping choices quickly */
button, input, textarea { touch-action: manipulation; }

body {
  font-family: var(--xp-font);
  color: var(--xp-white);
  background: var(--xp-dark);
  margin: 0;
  padding: 0;
  padding-bottom: 12rem;
  line-height: 1.5;
}

h1, h2, h3 { color: var(--xp-white); margin: 0; letter-spacing: -0.01em; }
h1 { font-weight: 700; font-size: 1.15rem; }
h2 { font-weight: 600; font-size: 1.05rem; }

.wrap { max-width: 44rem; margin: 0 auto; padding: 1.1rem 0.9rem 0; }
.hidden { display: none !important; }

/* header: North Shore Green with the Superior Green logo, a quiet Carmanah rule underneath */
header.app-header {
  background: var(--xp-dark); color: var(--xp-white);
  padding: calc(1rem + env(safe-area-inset-top, 0px)) 0 1.1rem;
  border-bottom: 2px solid var(--xp-carmanah);
}
.app-header-inner { max-width: 44rem; margin: 0 auto; padding: 0 0.9rem; }   /* same box as .wrap, so the left edges match at any width */
header.app-header img { width: 7.5rem; height: auto; display: block; }
header.app-header h1 { color: var(--xp-white); font-size: 1.3rem; line-height: 1.25; margin-top: 0.85rem; }
header.app-header p { margin: 0.3rem 0 0; font-size: 0.9rem; line-height: 1.4; color: var(--xp-white); }

.link-btn {
  font-family: var(--xp-font); font-weight: 600; font-size: 0.85rem;
  color: var(--xp-white); background: var(--xp-dark);
  border: 2px solid transparent; border-radius: 0.6rem;
  padding: 0.55rem 0.9rem; min-height: 2.8rem; cursor: pointer;
}

.notice {
  background: var(--xp-carmanah); border-left: 0.4rem solid var(--xp-orange);
  border-radius: 0.8rem; padding: 0.7rem 0.9rem; font-size: 0.9rem; margin-bottom: 1rem;
  display: flex; gap: 0.7rem; align-items: center; justify-content: space-between; flex-wrap: wrap;
}

/* the technician box is a small panel; the form itself sits straight on the page */
.card { margin-bottom: 1rem; }
.card.tech-card { background: var(--xp-carmanah); border-radius: 1rem; padding: 0.9rem; }
.card.tech-card input[type="text"] { background: var(--xp-dark); }
.card-title { margin-bottom: 1.2rem; }

.form-section { margin-bottom: 2.2rem; }
.form-section:last-child { margin-bottom: 0; }
.form-section-title {
  font-size: 1.05rem; font-weight: 600; color: var(--xp-green);
  padding-bottom: 0.5rem; margin-bottom: 1.1rem; border-bottom: 1px solid var(--xp-carmanah);
}

.field { margin-bottom: 1.7rem; padding: 0.2rem 0; scroll-margin-top: 1rem; }
.field:last-child { margin-bottom: 0; }
.q { display: block; font-weight: 600; font-size: 1.05rem; margin-bottom: 0.45rem; color: var(--xp-white); }
.q .opt, .form-section-title .opt { font-weight: 400; color: var(--xp-white); font-size: 0.9rem; }
.hint { font-size: 0.9rem; color: var(--xp-white); margin: 0 0 0.6rem; }
.sub-q { font-weight: 600; font-size: 0.95rem; margin: 0.9rem 0 0.4rem; }

/* choice buttons: Carmanah tiles, Superior Green when picked */
.choices { display: grid; gap: 0.6rem; grid-template-columns: 1fr; }
.choices.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.choices.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.choices.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.choices.cols-5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.choice {
  font-family: var(--xp-font); font-weight: 600; font-size: 1rem; line-height: 1.3;
  color: var(--xp-white); background: var(--xp-carmanah);
  border: 0; border-radius: 0.8rem;
  min-height: 3.5rem; padding: 0.7rem 0.8rem; cursor: pointer; text-align: left;
  display: flex; align-items: center; gap: 0.6rem; position: relative;
  -webkit-tap-highlight-color: transparent;
}
.choices.cols-5 .choice, .choices.cols-4 .choice, .choices.cols-3 .choice, .choices.cols-2 .choice { justify-content: center; text-align: center; }
.choice .mark {
  flex: 0 0 1.5rem; width: 1.5rem; height: 1.5rem; border-radius: 50%;
  border: 2px solid var(--xp-white); display: inline-flex; align-items: center; justify-content: center;
  font-size: 0.95rem; line-height: 1;
}
.choices.cols-5 .choice .mark, .choices.cols-4 .choice .mark, .choices.cols-3 .choice .mark, .choices.cols-2 .choice .mark { display: none; }
.choices.cols-5 .choice, .choices.cols-4 .choice, .choices.cols-3 .choice, .choices.cols-2 .choice { padding-left: 0.35rem; padding-right: 0.35rem; }
.choices.cols-3 { gap: 0.45rem; }
.choices.cols-3 .choice { font-size: 0.88rem; padding-left: 0.2rem; padding-right: 0.2rem; }
@media (max-width: 340px) { .choices.cols-3 { grid-template-columns: minmax(0, 1fr); } }
.choices.cols-5, .choices.cols-4 { gap: 0.45rem; }
.choice:active { background: var(--xp-solar); color: var(--xp-dark); }
.choice[aria-checked="true"] { background: var(--xp-green); color: var(--xp-dark); }
.choice[aria-checked="true"] .mark { background: var(--xp-dark); border-color: var(--xp-dark); color: var(--xp-green); font-weight: 700; }
/* selected check for side-by-side buttons is a corner badge: it takes no space, so nothing resizes or re-wraps */
.choices.cols-5 .choice[aria-checked="true"]::after, .choices.cols-4 .choice[aria-checked="true"]::after,
.choices.cols-3 .choice[aria-checked="true"]::after,
.choices.cols-2 .choice[aria-checked="true"]::after {
  content: "\2713"; position: absolute; top: -0.5rem; right: -0.35rem; width: 1.4rem; height: 1.4rem; border-radius: 50%;
  background: var(--xp-dark); color: var(--xp-green); border: 2px solid var(--xp-green);
  font-size: 0.75rem; font-weight: 700; line-height: calc(1.4rem - 4px); text-align: center;
}

/* text inputs: Carmanah boxes with a Superior Green underline, white text */
input[type="text"], input[type="number"], textarea {
  width: 100%; font-family: var(--xp-font); font-size: 1.05rem; color: var(--xp-white);
  background: var(--xp-carmanah); border: 0; border-radius: 0.8rem; caret-color: var(--xp-solar);
  box-shadow: inset 0 -3px 0 var(--xp-green);
  padding: 0.85rem 0.9rem; min-height: 3.4rem; -webkit-appearance: none; appearance: none;
}
textarea { min-height: 6.5rem; resize: vertical; }
input:focus, textarea:focus, .choice:focus-visible, .link-btn:focus-visible, button:focus-visible {
  outline: 3px solid var(--xp-solar); outline-offset: 2px;
}
.other-input { margin-top: 0.9rem; padding-left: 0.8rem; border-left: 3px solid var(--xp-carmanah); }
.other-input .sub-q { margin-top: 0; }

.unit-row { display: flex; align-items: center; gap: 0.6rem; }
.unit-row .prefix, .unit-row .suffix { font-weight: 600; font-size: 1.05rem; }
.unit-row input.light-input { flex: 0 0 6rem; width: 6rem; text-align: center; font-size: 1.05rem; font-weight: 400; padding: 0.85rem 0.4rem; }

.warn {
  margin-top: 0.7rem; background: var(--xp-carmanah); border-left: 0.4rem solid var(--xp-orange);
  border-radius: 0.8rem; padding: 0.7rem 0.9rem; font-size: 0.9rem;
}
.warn .choices { margin-top: 0.6rem; }
.warn .choice { background: var(--xp-dark); }
.warn .choice[aria-checked="true"] { background: var(--xp-green); }

/* photo checklist */
.photo-head { display: flex; justify-content: space-between; align-items: center; gap: 0.6rem; margin-bottom: 0.6rem; flex-wrap: wrap; }
.photo-count { font-weight: 600; font-size: 0.95rem; }
.check {
  display: flex; align-items: center; gap: 0.7rem; width: 100%;
  font-family: var(--xp-font); font-weight: 600; font-size: 0.95rem; text-align: left;
  color: var(--xp-white); background: var(--xp-carmanah);
  border: 0; border-radius: 0.8rem;
  min-height: 2.9rem; padding: 0.35rem 0.8rem; margin-bottom: 0.35rem; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.check .box {
  flex: 0 0 1.5rem; width: 1.5rem; height: 1.5rem; border: 2px solid var(--xp-white); border-radius: 0.35rem;
  display: inline-flex; align-items: center; justify-content: center; font-weight: 700; line-height: 1;
}
.check[aria-checked="true"] { background: var(--xp-green); color: var(--xp-dark); }
.check[aria-checked="true"] .box { background: var(--xp-dark); border-color: var(--xp-dark); color: var(--xp-green); }

/* install-location groups (ONT, router, each XWH): no box, just a quiet Carmanah rule down the side */
.device-card { border-left: 3px solid var(--xp-carmanah); padding: 0; margin-bottom: 1.8rem; }
.device-head { padding: 0.1rem 0.9rem 0.2rem; }
.device-head .q { margin: 0; }
.device-body { padding: 0.4rem 0.9rem 0.4rem; }
.device-rule { border: 0; margin: 0.4rem 0 0; }
.device-body .light-block { margin: 0.9rem 0 0; padding: 0; }
.device-body .light-block.has-error { padding-left: 0.4rem; margin-left: -0.9rem; margin-top: 0.9rem; }
.field.device-card.has-error { border-left: 0.5rem solid var(--xp-orange); padding-left: 0; margin-left: 0; }

/* discreet tick box (own router, splice already done, reused patch) */
.mini-check-wrap { margin-top: 1rem; padding-top: 0.2rem; }
.mini-check {
  display: flex; align-items: center; gap: 0.6rem; width: 100%; min-height: 2.9rem; padding: 0.3rem 0;
  font-family: var(--xp-font); font-weight: 400; font-size: 0.95rem; text-align: left; color: var(--xp-white);
  background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.mini-box {
  flex: 0 0 1.4rem; width: 1.4rem; height: 1.4rem; border: 2px solid var(--xp-white); border-radius: 0.3rem;
  display: inline-flex; align-items: center; justify-content: center; font-size: 0.9rem; font-weight: 700; line-height: 1;
}
.mini-check[aria-checked="true"] .mini-box { background: var(--xp-green); border-color: var(--xp-green); color: var(--xp-dark); }

/* validation */
.field.has-error { border-left: 0.4rem solid var(--xp-orange); padding-left: 0.4rem; margin-left: -0.8rem; }
.field-error-msg { font-weight: 600; font-size: 0.9rem; margin-top: 0.5rem; }
.field-error-msg::before { content: "\26A0  "; color: var(--xp-orange); }


/* must-explain box for missing photos */
.need-reason {
  margin-top: 0.8rem; background: var(--xp-carmanah); border-left: 0.5rem solid var(--xp-orange);
  border-radius: 0.8rem; padding: 0.9rem;
}
.need-reason strong { display: block; font-size: 1.05rem; margin-bottom: 0.4rem; }
.need-reason textarea { background: var(--xp-dark); box-shadow: inset 0 -3px 0 var(--xp-orange); }

/* output */
#output-wrap { margin-top: 1.2rem; }
#output-box {
  background: var(--xp-carmanah); color: var(--xp-white); border-radius: 1rem; padding: 1rem;
  white-space: pre-wrap; font-size: 1rem; line-height: 1.55;
  -webkit-user-select: text; user-select: text;
}

/* buttons: Superior Green main button that brightens to Solar Wind once every answer is in */
button.btn {
  font-family: var(--xp-font); font-weight: 700; font-size: 1.1rem; border-radius: 0.8rem;
  padding: 0.9rem 1rem; min-height: 3.5rem; cursor: pointer; border: 0;
  -webkit-tap-highlight-color: transparent;
}
button.btn.primary { background: var(--xp-green); color: var(--xp-dark); }
button.btn.primary.ready { background: var(--xp-solar); }
button.btn.primary:active { background: var(--xp-solar); }
button.btn.secondary { background: var(--xp-carmanah); color: var(--xp-white); }
button.btn.secondary:active { background: var(--xp-green); color: var(--xp-dark); }
button.btn.done { background: var(--xp-green); color: var(--xp-dark); }

.sticky-bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; background: var(--xp-dark);
  box-shadow: 0 -10px 18px 4px var(--xp-dark);
  padding: 0.5rem 0 calc(0.5rem + env(safe-area-inset-bottom, 0px));
}
/* compact on purpose: it is always on screen */
.sticky-inner { max-width: 44rem; margin: 0 auto; padding: 0 0.9rem; display: grid; gap: 0.5rem; }
.sticky-inner .btn, .sticky-inner > .link-btn { white-space: nowrap; }
.sticky-inner .btn { min-height: 3.1rem; font-size: 1rem; padding: 0.55rem 0.8rem; }
.sticky-inner.edit { grid-template-columns: 1fr auto; }
.sticky-inner > .link-btn { background: var(--xp-carmanah); font-size: 0.8rem; min-height: 3.1rem; padding: 0 0.75rem; border-radius: 0.8rem; }
/* very narrow phones: stack the two buttons instead of squeezing them */
@media (max-width: 350px) { .sticky-inner.edit { grid-template-columns: 1fr; } .sticky-inner > .link-btn { min-height: 2.8rem; } }
.sticky-inner .row { display: flex; gap: 0.5rem; }
.sticky-inner .row .btn { flex: 1; min-height: 2.8rem; font-size: 0.9rem; }
.next-step { font-weight: 600; font-size: 0.95rem; margin: 0.8rem 0 0; }

/* confirm dialog */
.overlay { position: fixed; inset: 0; background: rgba(0,43,43,.88); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 1rem; }
.dialog { background: var(--xp-dark); color: var(--xp-white); border: 2px solid var(--xp-carmanah); border-radius: 1rem; padding: 1.2rem; max-width: 26rem; width: 100%; }
.dialog p { font-size: 1.1rem; font-weight: 600; margin: 0 0 1rem; }
.dialog .row { display: grid; gap: 0.6rem; }

footer.app-footer { margin-top: 2rem; padding-top: 0.8rem; font-size: 0.75rem; color: var(--xp-green); text-align: center; }

/* phone held sideways: put the bottom buttons side by side so they don't eat the screen */
@media (max-height: 520px) {
  .sticky-inner.output { grid-template-columns: repeat(3, 1fr); }
  .sticky-inner.output .row { display: contents; }
  .sticky-inner.output .row .btn { min-height: 3.1rem; font-size: 1rem; }
}

/* ---- theme switch (sits in the North Shore header, so it looks the same in both themes) ---- */
.header-top { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
.theme-switch {
  display: inline-flex; align-items: center; gap: 0.55rem; min-height: 2.75rem; padding: 0 0.2rem 0 0.6rem;
  font-family: var(--xp-font); font-weight: 600; font-size: 0.85rem; color: var(--xp-white);
  background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.ts-track { position: relative; width: 3rem; height: 1.7rem; border-radius: 1rem; background: var(--xp-carmanah); flex: 0 0 auto; transition: background .15s; }
.ts-knob { position: absolute; top: 0.2rem; left: 0.2rem; width: 1.3rem; height: 1.3rem; border-radius: 50%; background: var(--xp-white); transition: transform .15s; }
.theme-switch[aria-checked="true"] .ts-track { background: var(--xp-green); }
.theme-switch[aria-checked="true"] .ts-knob { transform: translateX(1.3rem); background: var(--xp-dark); }

/* ---- light theme: white page, North Shore text, Carmanah outlines, picked = North Shore ---- */
:root[data-theme="light"] { color-scheme: light; --xp-line: var(--xp-carmanah); }
:root[data-theme="light"] { background: var(--xp-white); }

:root[data-theme="light"] h1, :root[data-theme="light"] h2, :root[data-theme="light"] h3 { color: var(--xp-dark); }
:root[data-theme="light"] header.app-header h1, :root[data-theme="light"] header.app-header p { color: var(--xp-white); }
:root[data-theme="light"] .q, :root[data-theme="light"] .q .opt, :root[data-theme="light"] .hint, :root[data-theme="light"] .form-section-title .opt { color: var(--xp-dark); }

:root[data-theme="light"] .notice, :root[data-theme="light"] .card.tech-card { background: var(--xp-white); color: var(--xp-dark); box-shadow: inset 0 0 0 2px var(--xp-carmanah); }
:root[data-theme="light"] .notice { border-left-color: var(--xp-orange); }
:root[data-theme="light"] .choice, :root[data-theme="light"] .check { background: var(--xp-white); color: var(--xp-dark); box-shadow: inset 0 0 0 2px var(--xp-carmanah); }
:root[data-theme="light"] .choice:active, :root[data-theme="light"] .check:active { background: var(--xp-solar); color: var(--xp-dark); }
:root[data-theme="light"] .choice[aria-checked="true"], :root[data-theme="light"] .check[aria-checked="true"] { background: var(--xp-dark); color: var(--xp-white); box-shadow: none; }
:root[data-theme="light"] .choice .mark { border-color: var(--xp-dark); }
:root[data-theme="light"] .choice[aria-checked="true"] .mark { background: var(--xp-white); border-color: var(--xp-white); color: var(--xp-dark); }
:root[data-theme="light"] .check .box { border-color: var(--xp-dark); }
:root[data-theme="light"] .check[aria-checked="true"] .box { background: var(--xp-green); border-color: var(--xp-green); color: var(--xp-dark); }
:root[data-theme="light"] input[type="text"], :root[data-theme="light"] input[type="number"], :root[data-theme="light"] textarea,
:root[data-theme="light"] .card.tech-card input[type="text"] { background: var(--xp-white); color: var(--xp-dark); caret-color: var(--xp-dark); box-shadow: inset 0 0 0 2px var(--xp-carmanah); }
:root[data-theme="light"] input:focus, :root[data-theme="light"] textarea:focus { box-shadow: inset 0 0 0 2px var(--xp-dark); outline: 3px solid var(--xp-green); outline-offset: 2px; }
:root[data-theme="light"] .choice:focus-visible, :root[data-theme="light"] .link-btn:focus-visible, :root[data-theme="light"] button:focus-visible { outline-color: var(--xp-dark); }

:root[data-theme="light"] .warn, :root[data-theme="light"] .need-reason { background: var(--xp-white); color: var(--xp-dark); box-shadow: inset 0 0 0 2px var(--xp-carmanah); }

:root[data-theme="light"] .warn .choice[aria-checked="true"] { background: var(--xp-dark); }

:root[data-theme="light"] .mini-check { color: var(--xp-dark); }
:root[data-theme="light"] .mini-box { border-color: var(--xp-dark); }

:root[data-theme="light"] #output-box { background: var(--xp-white); color: var(--xp-dark); box-shadow: inset 0 0 0 2px var(--xp-carmanah); }
:root[data-theme="light"] button.btn.primary { background: var(--xp-dark); color: var(--xp-white); }
:root[data-theme="light"] button.btn.primary.ready { background: var(--xp-green); color: var(--xp-dark); }
:root[data-theme="light"] button.btn.primary:active { background: var(--xp-solar); color: var(--xp-dark); }
:root[data-theme="light"] button.btn.secondary { background: var(--xp-white); color: var(--xp-dark); box-shadow: inset 0 0 0 2px var(--xp-carmanah); }
:root[data-theme="light"] button.btn.done { background: var(--xp-green); color: var(--xp-dark); }
:root[data-theme="light"] .sticky-bar { background: var(--xp-white); box-shadow: 0 -10px 18px 4px var(--xp-white); }
:root[data-theme="light"] .sticky-inner > .link-btn { background: var(--xp-white); }
:root[data-theme="light"] .dialog { background: var(--xp-white); color: var(--xp-dark); border-color: var(--xp-carmanah); }
:root[data-theme="light"] footer.app-footer { color: var(--xp-carmanah); }

/* ---- light theme, option A "soft mint" (chosen by the owner): pale mint page, white tiles with a soft shadow, picked = Superior Green ---- */
:root[data-theme="light"] { --xp-mint: #F2F8F4; --xp-soft-line: #C7D9CF; --xp-lift: 0 1px 3px rgba(0,43,43,.22); background: var(--xp-mint); }
:root[data-theme="light"] body { background: var(--xp-mint); }
:root[data-theme="light"] .choice, :root[data-theme="light"] .check, :root[data-theme="light"] .link-btn, :root[data-theme="light"] button.btn.secondary, :root[data-theme="light"] .notice, :root[data-theme="light"] .card.tech-card, :root[data-theme="light"] .warn, :root[data-theme="light"] .need-reason, :root[data-theme="light"] #output-box, :root[data-theme="light"] .warn .choice { background: var(--xp-white); box-shadow: var(--xp-lift); }
:root[data-theme="light"] input[type="text"], :root[data-theme="light"] input[type="number"], :root[data-theme="light"] textarea, :root[data-theme="light"] .card.tech-card input[type="text"] { background: var(--xp-white); box-shadow: inset 0 0 0 2px var(--xp-soft-line); }
:root[data-theme="light"] input:focus, :root[data-theme="light"] textarea:focus { box-shadow: inset 0 0 0 2px var(--xp-carmanah); }
:root[data-theme="light"] .need-reason textarea { box-shadow: inset 0 0 0 3px var(--xp-orange); }
:root[data-theme="light"] .choice[aria-checked="true"], :root[data-theme="light"] .check[aria-checked="true"], :root[data-theme="light"] .warn .choice[aria-checked="true"] { background: var(--xp-green); color: var(--xp-dark); box-shadow: none; }
:root[data-theme="light"] .choice[aria-checked="true"] .mark, :root[data-theme="light"] .check[aria-checked="true"] .box { background: var(--xp-dark); border-color: var(--xp-dark); color: var(--xp-green); }
:root[data-theme="light"] .choices.cols-2 .choice[aria-checked="true"]::after, :root[data-theme="light"] .choices.cols-3 .choice[aria-checked="true"]::after, :root[data-theme="light"] .choices.cols-5 .choice[aria-checked="true"]::after, :root[data-theme="light"] .choices.cols-4 .choice[aria-checked="true"]::after { background: var(--xp-dark); border-color: var(--xp-mint); color: var(--xp-green); }
:root[data-theme="light"] .mini-check[aria-checked="true"] .mini-box { background: var(--xp-green); border-color: var(--xp-green); color: var(--xp-dark); }
:root[data-theme="light"] .form-section-title { border-bottom-color: var(--xp-soft-line); }
:root[data-theme="light"] .sticky-bar { background: var(--xp-mint); box-shadow: 0 -10px 18px 4px var(--xp-mint); }
:root[data-theme="light"] .sticky-inner > .link-btn { background: var(--xp-white); }

/* =====================================================================================
   v2.6: live comment, progress, toasts, settings, change log, extras
   ===================================================================================== */
:root { --xp-green-rgb: 88,199,116; --xp-dark-rgb: 0,43,43; --bar-h: 5rem; }
body { padding-bottom: 6rem; }

/* sections and questions slide in and out instead of jumping */
.slide-in { animation: xp-slide-in 0.32s ease-out both; overflow: hidden; }
@keyframes xp-slide-in { from { opacity: 0; max-height: 0; transform: translateY(-8px); } to { opacity: 1; max-height: 80rem; transform: none; } }
.slide-out { animation: xp-slide-out 0.28s ease-in both; overflow: hidden; pointer-events: none; }
@keyframes xp-slide-out { from { opacity: 1; max-height: var(--h, 20rem); } to { opacity: 0; max-height: 0; margin-top: 0; margin-bottom: 0; padding-top: 0; padding-bottom: 0; } }
button.btn.pop { animation: xp-pop 0.32s ease-out; }
@keyframes xp-pop { 0% { transform: scale(0.96); } 55% { transform: scale(1.04); } 100% { transform: scale(1); } }

/* the live comment: a card under the form */
.preview-card { background: var(--xp-carmanah); border-radius: 1rem; padding: 1rem; margin-top: 2.4rem; scroll-margin-top: 1rem; }
.preview-card h2 { font-size: 1.15rem; font-weight: 700; margin-bottom: 0.6rem; }
.preview-card #output-box { background: var(--xp-dark); border-radius: 0.8rem; padding: 0.85rem 0.9rem; font-size: 0.9rem; line-height: 1.5; overflow-wrap: anywhere; }
.preview-foot { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; margin-top: 0.7rem; flex-wrap: wrap; }
.preview-foot .next-step { margin: 0; flex: 1 1 12rem; }
.preview-foot .next-step:empty { display: none; }
.preview-foot .link-btn { margin-left: auto; }
.missing { color: inherit; opacity: 0.75; border-bottom: 1px dotted rgba(255,178,28,0.8); padding: 0 0.1rem; font-weight: 400; cursor: pointer; }
/* it only gets loud when someone tries to copy before finishing */
#output-box.loud .missing { background: var(--xp-orange); color: var(--xp-dark); opacity: 1; border-bottom: 0; border-radius: 0.25rem; padding: 0 0.3rem; font-weight: 600; }
.field.jump-flash, .light-block.jump-flash { animation: jump-flash 1.5s ease-out; border-radius: 0.6rem; }
@keyframes jump-flash { 0%, 30% { box-shadow: 0 0 0 4px rgba(255,178,28,0.75); } 100% { box-shadow: 0 0 0 4px rgba(255,178,28,0); } }

/* progress: a thin line on the bottom bar and one on the comment card; the comment glows when it is ready */
.progress { height: 6px; border-radius: 3px; background: rgba(var(--xp-green-rgb),0.22); overflow: hidden; margin: 0 0 0.8rem; }
.progress > span { display: block; height: 100%; width: 0; background: var(--xp-green); border-radius: 3px; transition: width 0.4s ease; }
.progress.full > span { box-shadow: 0 0 10px var(--xp-green); }
.sticky-bar .progress { position: absolute; left: 0; right: 0; top: 0; height: 3px; margin: 0; border-radius: 0; }
.sticky-bar .progress > span { border-radius: 0; }
.preview-card #output-box.perfect { animation: xp-glow 2.4s ease-in-out infinite; }
@keyframes xp-glow { 0%,100% { box-shadow: 0 0 0 2px rgba(var(--xp-green-rgb),0.55), 0 0 6px rgba(var(--xp-green-rgb),0.25); } 50% { box-shadow: 0 0 0 2px var(--xp-green), 0 0 18px rgba(var(--xp-green-rgb),0.6); } }

/* bottom bar: Copy Comment plus one helper button (Preview, Next Missing, or Start Next Job) */
.sticky-inner.bar { grid-template-columns: minmax(0, 1fr) auto; }
.sticky-inner.bar .btn.secondary { font-size: 0.9rem; padding: 0.55rem 0.9rem; }
@media (max-width: 359px) { .sticky-inner.bar .btn { font-size: 0.92rem; padding-left: 0.6rem; padding-right: 0.6rem; } }

/* toast: Undo after clearing, and the offer to restore an unfinished job */
.toast { position: fixed; left: 50%; bottom: calc(var(--bar-h) + 0.7rem); transform: translateX(-50%); z-index: 70; display: flex; align-items: center; gap: 0.7rem; width: max-content; max-width: calc(100vw - 1.8rem); padding: 0.5rem 0.5rem 0.5rem 1rem; border-radius: 0.9rem; background: var(--xp-dark); color: var(--xp-white); border: 2px solid var(--xp-green); box-shadow: 0 10px 30px rgba(0,0,0,0.3); font-size: 0.9rem; animation: toast-in .22s ease-out; }
.toast[hidden] { display: none; }
.toast.out { opacity: 0; transform: translate(-50%, 8px); transition: opacity .2s, transform .2s; }
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }
.toast-msg { line-height: 1.35; }
.toast button { font: inherit; cursor: pointer; border: 0; -webkit-tap-highlight-color: transparent; }
.toast-act { flex: none; font-weight: 700; min-height: 2.75rem; padding: 0.4rem 0.95rem; border-radius: 0.6rem; background: var(--xp-green); color: var(--xp-dark); }
.toast-x { flex: none; background: none; color: inherit; opacity: 0.75; font-size: 1.35rem; line-height: 1; min-width: 2.75rem; min-height: 2.75rem; }

/* Additional Comments: one bullet per line, with a character count */
.comment-meta { display: flex; justify-content: space-between; gap: 0.6rem; margin-top: 0.4rem; font-size: 0.8rem; opacity: 0.85; }
.comment-meta .over { color: var(--xp-orange); font-weight: 700; opacity: 1; }

/* first-visit name prompt */
.name-dialog .name-hint { font-size: 0.85rem; opacity: 0.85; margin: -0.5rem 0 0.9rem; }
.name-dialog input { width: 100%; }
.name-dialog .sub-q { margin: 0.7rem 0 0.35rem; }
.name-dialog .name-hint + .sub-q { margin-top: 0; }
.name-dialog .row { margin-top: 1.1rem; }

/* footer: version (opens the change log), name, and a Settings panel */
footer.app-footer { margin-top: 2.2rem; padding-bottom: 0.5rem; }
footer.app-footer .footer-text { transition: opacity 0.5s; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
footer.app-footer button.ver-link { font: inherit; color: inherit; background: none; border: 0; padding: 0.8rem 0.2rem; margin: 0; cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; -webkit-tap-highlight-color: transparent; }
.footer-note { max-width: 30rem; margin: 0.2rem auto 0; font-size: 0.7rem; line-height: 1.45; opacity: 0.85; }
.settings-btn { display: inline-flex; align-items: center; gap: 0.45rem; min-height: 2.75rem; padding: 0 1rem; margin-bottom: 0.4rem; border-radius: 1.4rem; font: 600 0.85rem var(--xp-font); color: var(--xp-white); background: var(--xp-carmanah); border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.settings-panel { max-width: 22rem; margin: 0.2rem auto 0.8rem; padding: 0.8rem 0.9rem 0.6rem; border-radius: 1rem; background: var(--xp-carmanah); color: var(--xp-white); text-align: left; font-size: 0.9rem; animation: xp-pop-in 0.18s ease-out; }
.settings-panel[hidden] { display: none; }
.settings-group { margin: 0 0 0.45rem; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.8; }
.settings-panel .choices { gap: 0.4rem; margin-bottom: 0.3rem; }
.settings-panel .choice { min-height: 2.75rem; font-size: 0.85rem; background: var(--xp-dark); }
.settings-panel .choice[aria-checked="true"] { background: var(--xp-green); color: var(--xp-dark); }
.settings-panel .theme-switch { width: 100%; justify-content: space-between; padding: 0; color: inherit; }
.settings-panel .theme-switch[hidden] { display: none; }
.settings-panel .ts-track { background: var(--xp-dark); }
.settings-panel .theme-switch[aria-checked="true"] .ts-track { background: var(--xp-green); }

/* change log and the small surprise cards */
.changelog, .thanks { position: fixed; inset: 0; z-index: 110; display: flex; align-items: center; justify-content: center; padding: 1rem; background: rgba(var(--xp-dark-rgb),0.75); }
.changelog-card { width: 100%; max-width: 34rem; max-height: min(85vh, 44rem); display: flex; flex-direction: column; background: var(--xp-white); color: var(--xp-dark); border-radius: 1rem; box-shadow: 0 0 0 3px var(--xp-green), 0 12px 40px rgba(0,0,0,0.4); animation: xp-pop-in 0.3s ease-out; text-align: left; }
.changelog-head { padding: 1rem 1.2rem 0.5rem; }
.changelog-head h2, .changelog-card h3 { color: var(--xp-dark); }
.changelog-head h2 { font-size: 1.25rem; color: var(--xp-carmanah); }
.changelog-body { overflow-y: auto; padding: 0.2rem 1.2rem 0.8rem; -webkit-overflow-scrolling: touch; }
.changelog-body section { padding: 0.7rem 0; border-top: 1px solid rgba(var(--xp-dark-rgb),0.15); }
.changelog-body section:first-child { border-top: 0; }
.changelog-body h3 { margin: 0 0 0.3rem; font-size: 1rem; display: flex; align-items: baseline; gap: 0.6rem; flex-wrap: wrap; }
.changelog-body .cl-date { font-size: 0.8rem; font-weight: 400; opacity: 0.7; }
.changelog-body ul { margin: 0; padding-left: 1.2rem; }
.changelog-body li { margin: 0.25rem 0; line-height: 1.45; font-size: 0.9rem; }
.changelog-foot { padding: 0.8rem 1.2rem 1rem; border-top: 1px solid rgba(var(--xp-dark-rgb),0.15); }
.changelog-foot .btn { width: 100%; }
.thanks, .thanks *, header.app-header img { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
.thanks-card { max-width: 24rem; background: var(--xp-white); color: var(--xp-dark); border-radius: 1rem; padding: 1.4rem 1.4rem 1.2rem; text-align: center; box-shadow: 0 0 0 3px var(--xp-green), 0 12px 40px rgba(0,0,0,0.4); animation: xp-pop-in 0.35s ease-out; }
.thanks-card h2 { color: var(--xp-carmanah); margin-bottom: 0.6rem; font-size: 1.2rem; }
.thanks-card p { line-height: 1.5; margin: 0 0 1rem; }
.thanks-card .btn { width: 100%; }
@keyframes xp-pop-in { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* the logo: tap it (it bounces and chimes), and it stretches after ten idle minutes */
header.app-header .header-top img { cursor: pointer; touch-action: manipulation; transform-origin: 50% 60%; }
header.app-header .header-top img.spin { animation: xp-spin 0.7s ease-in-out; }
@keyframes xp-spin { 0% { transform: scale(1) rotate(0); } 50% { transform: scale(1.35) rotate(360deg); } 100% { transform: scale(1) rotate(720deg); } }
header.app-header .header-top img.yawn { transform-origin: 50% 100%; animation: xp-yawn 2.6s ease-in-out; }
@keyframes xp-yawn { 0%, 100% { transform: scale(1, 1) rotate(0); } 30% { transform: scale(0.94, 1.14) rotate(-3deg); } 55% { transform: scale(0.94, 1.14) rotate(3deg); } 75% { transform: scale(1.04, 0.95) rotate(0); } }

/* OLED black: dark mode on a true black page (saves battery on OLED screens); tiles become a deep green-grey */
:root[data-theme="dark"][data-oled="on"] { --xp-dark: #000000; --xp-carmanah: #1A302B; --xp-dark-rgb: 0,0,0; }

/* switching colour mode fades instead of snapping (the class is only on the page for a moment) */
:root.theme-fade, :root.theme-fade *, :root.theme-fade *::before, :root.theme-fade *::after {

:root[data-retro="on"][data-theme="dark"][data-oled="on"] { --xp-dark: #000000; --xp-carmanah: #12426E; --xp-dark-rgb: 0,0,0; }
:root[data-retro="on"][data-theme="light"] { --xp-dark: #333D47; --xp-carmanah: #0079C1; --xp-green: #0079C1; --xp-solar: #33A0DA; --xp-mint: #FFFFFF; --xp-soft-line: #DADFE4; --xp-green-rgb: 0,121,193; --xp-dark-rgb: 51,61,71; --xp-lift: 0 0 0 1px #A9CBE3; --retro-foot: #E3E3E3; }
:root[data-retro="on"][data-theme="dark"] { --retro-foot: #071E38; }
.retro-hero { display: none; }
:root[data-retro="on"] .retro-hero { display: block; position: relative; overflow: hidden; color: #fff; background: linear-gradient(100deg, #0F78BF 0%, #1B5CA4 55%, #1E468A 100%); }
:root[data-retro="on"] .retro-hero::before { content: ""; position: absolute; inset: 0; opacity: 0.9; background: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='110' height='300' viewBox='0 0 110 300'%3E%3Cpolygon points='0,0 50,0 110,150 50,300 0,300 60,150' fill='%23ffffff' fill-opacity='0.13'/%3E%3C/svg%3E") repeat-x right center / 80px 100%; -webkit-mask-image: linear-gradient(90deg, transparent 25%, #000 85%); mask-image: linear-gradient(90deg, transparent 25%, #000 85%); }
.retro-hero-inner { position: relative; max-width: 44rem; margin: 0 auto; padding: 1rem 0.9rem 1.1rem; }

.retro-hero h2 span { opacity: 0.55; margin: 0 0.2em; font-weight: 200; }
.retro-cta { margin-top: 0.5rem; font-family: var(--xp-font); font-size: 1rem; font-weight: 600; text-transform: uppercase; color: #fff; background: #7FC241; border: 0; border-radius: 4px; min-height: 2.75rem; padding: 0.5rem 1.3rem; cursor: pointer; }
:root[data-retro="on"] header.app-header { border-bottom: 8px solid #0079C1; }

:root[data-retro="on"] .choice, :root[data-retro="on"] .check, :root[data-retro="on"] input[type="text"], :root[data-retro="on"] textarea { border-radius: 4px; }
:root[data-retro="on"] button.btn { border-radius: 4px; text-transform: uppercase; letter-spacing: 0.02em; }
:root[data-retro="on"] button.btn.primary, :root[data-retro="on"] button.btn.done, :root[data-retro="on"] .toast-act { background: #7FC241; color: #fff; }
:root[data-retro="on"] button.btn.primary.ready { background: #6DB02F; color: #fff; }
:root[data-retro="on"] button.btn.secondary { background: #0079C1; color: #fff; box-shadow: none; }
:root[data-retro="on"] .progress > span { background: #7FC241; }
:root[data-retro="on"] .preview-card { border-radius: 6px; }
:root[data-retro="on"] footer.app-footer { padding: 1rem 0 1.2rem; box-shadow: 0 0 0 100vmax var(--retro-foot); clip-path: inset(0 -100vmax); background: var(--retro-foot); }
:root[data-retro="on"][data-theme="light"] header.app-header { background: #fff; }

:root[data-retro="on"][data-theme="light"] header.app-header img { background: none; border-radius: 0; }

:root[data-retro="on"][data-theme="light"] .choice, :root[data-retro="on"][data-theme="light"] .check { color: #0079C1; }

  .slide-in, .slide-out, button.btn.pop, .toast, .field.jump-flash, .light-block.jump-flash, .changelog-card, .thanks-card, .settings-panel,

.job-section .form-section-title { margin-bottom: 0.9rem; }

<header class="app-header">

<script>
var APP_VERSION = '2.7.2';
/* ===================== helpers ===================== */
function $(id) { return document.getElementById(id); }

function el(tag, attrs, children) {
  var node = document.createElement(tag);
  Object.keys(attrs || {}).forEach(function (k) {
    if (k === 'class') node.className = attrs[k];
    else if (k === 'text') node.textContent = attrs[k];
    else if (k.indexOf('on') === 0) node.addEventListener(k.slice(2), attrs[k]);
    else node.setAttribute(k, attrs[k]);
  });
  (children || []).forEach(function (c) {
    if (c === null || c === undefined) return;
    node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return node;
}

var store = {
  get: function (k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } },
  set: function (k, v) { try { window.localStorage.setItem(k, v); } catch (e) {} },
  del: function (k) { try { window.localStorage.removeItem(k); } catch (e) {} },
  ok: function () { try { var k = '__xp_test'; window.localStorage.setItem(k, '1'); window.localStorage.removeItem(k); return true; } catch (e) { return false; } }
};

function cap(t) { t = String(t || '').trim(); return t ? t.charAt(0).toUpperCase() + t.slice(1) : ''; }
function lowerFirst(t) { t = String(t || '').trim(); return t ? t.charAt(0).toLowerCase() + t.slice(1) : ''; }
function str(v) { return String(v === undefined || v === null ? '' : v).trim(); }
function calm() { return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }

/* ===================== state ===================== */
var OLD_DRAFT_KEY = 'xplore_fsl_draft_fibre_existing_v16';   // before 2.6 the job was saved here; it is moved to WIP_KEY once
var OLD_WIP_KEY = 'xplore_fsl_wip_v1';   // 2.6: one form only, no job saved
var WIP_KEY = 'xplore_fsl_wip_v2';
var NAME_FIRST_KEY = 'xplore_fsl_tech_first_name';
var NAME_LAST_KEY = 'xplore_fsl_tech_last_name';
var NAME_ASKED_KEY = 'xplore_fsl_name_asked';

var STATE = {};
var ERRORS = [];            // [{id, label, msg}]; only filled once they try to copy (or a light reading needs checking)
var COPIED = false;         // the finished comment has been copied
var COPY_FLASH = false, FLASH_TIMER = null;
var PENDING_FOCUS = null;   // field id whose "Other" box should grab focus after the next render
var LIGHT_PROMPT = false;   // true once they've moved on with a light level that needs checking

/* Additional Comments: set this to FSL's comment limit to show "used / limit" and warn when over. 0 = just count. */
var COMMENT_LIMIT = 0;

function getName() { return { first: str(store.get(NAME_FIRST_KEY)), last: str(store.get(NAME_LAST_KEY)) }; }
function hasAnswers(st) {
  if (!st || typeof st !== 'object') return false;
  return Object.keys(st).some(function (k) {
    var v = st[k];
    if (v && typeof v === 'object') return Object.keys(v).some(function (kk) { return !!v[kk]; });
    return v !== undefined && v !== null && v !== '' && v !== false;
  });
}

/* ===================== error handling ===================== */
function errFor(id) { for (var i = 0; i < ERRORS.length; i++) if (ERRORS[i].id === id) return ERRORS[i]; return null; }

function jumpTo(id) {
  if (id === 'tech') { askName(); return; }
  var node = document.querySelector('#form-mount [data-field-id="' + id + '"]');
  if (!node) return;
  node.scrollIntoView({ behavior: calm() ? 'auto' : 'smooth', block: 'center' });

    id: 'nid',
    render: function () {
      var wrap = choiceField({ id: 'nid', key: 'nid', label: 'NID', options: ['Pre-Installed', 'Installed New'], cols: 2 });
      if (STATE.nid === 'Pre-Installed') wrap.insertBefore(miniCheck('splice_prior', 'Splice already done in NID'), wrap.querySelector('.field-error-msg'));
      return wrap;
    },
    check: function (need) { need('nid', 'NID', !!STATE.nid); },
    out: function (m) {
      var l = ['NID: ' + (STATE.nid ? cap(STATE.nid) : m('nid', 'Pre-Installed or Installed New'))];
      if (STATE.nid === 'Pre-Installed') l.push('Splice Status: ' + (STATE.splice_prior === true ? 'Completed in NID prior to install' : 'Completed by tech at install'));

function connectorC() { return choiceC({ id: 'connector', label: 'Connector Type', options: ['Mechanical', 'Spliced Pigtail'], cols: 2, out: 'Connector', gap: 'Connector type' }); }
/* reused: 'nid' = the reused box only shows for a Pre-Installed NID; 'always' = it always shows (drop required forms have no NID question) */
function patchC(reused) {
  function showReused() { return reused === 'always' || STATE.nid === 'Pre-Installed'; }
  return {
    id: 'patch',
    render: function () {
      var id = 'patch', controls = [choiceGroup('cab_len', ['4m', '8m', '15m', '30m', 'Other'], 3, id)];
      if (STATE.cab_len === 'Other') controls.push(otherInput('cab_other', id, 'Other Length'));
      if (showReused()) controls.push(miniCheck('cab_reused', 'Reused existing fibre patch'));
      return fieldWrap(id, 'Fibre Patch', false, null, controls);
    },
    check: function (need) { need('patch', 'Fibre Patch', !!STATE.cab_len && (STATE.cab_len !== 'Other' || !!str(STATE.cab_other)), 'Choose the length, or type it if you chose Other.'); },
    out: function (m) {
      var cab;
      if (!STATE.cab_len) cab = m('patch', 'Patch length');
      else if (STATE.cab_len === 'Other') cab = str(STATE.cab_other) || m('patch', 'Other length');
      else cab = STATE.cab_len;
      if (STATE.cab_len && showReused()) cab = (STATE.cab_reused === true ? 'Reused Existing ' : 'New ') + cab;
      return ['Fibre Patch: ' + cap(cab)];
    }
  };
}
/* ONT card with the light level inside it */
function ontC() {
  return {
    id: 'ont',
    render: function () { return locationField('ont', 'ont', 'ONT Installation Location', ROOM_OPTIONS, lightBlock); },
    check: function (need, issues) {
      need('ont', 'ONT Installation Location', locationDone('ont'), 'Choose the floor and the room.');
      var lp = parseLight(STATE.light);
      if (lp === null) issues.push({ id: 'light', label: 'Final Light Level', msg: 'Type the number only.' });
      else if (!lightInRange(lp) && STATE.light_ok !== lp) issues.push({ id: 'light', label: 'Final Light Level (please check it)', msg: 'This reading looks unusual. Check it, or tap the "Yes" button above.' });
    },
    out: function (m) {
      var lp = parseLight(STATE.light);
      var light = lp === null ? m('light', 'Light level') : '-' + lp + ' dBm' + (lightNeedsCheck() ? ' ' + m('light', 'Check the reading') : '');
      return ['Final Light Level at ONT: ' + light, 'ONT Location: ' + locationText('ont', m)];
    }
  };
}

    check: function (need) {
      need(key, label, !!STATE[key], 'Choose None, or how many you installed.');
      for (var i = 1; i <= unitCount(key); i++) need(key + i, unitName(key, abbr, i) + ' Installation Location', locationDone(key + i), 'Choose the floor and the room.');

    out: function (m) {

/* ===================== the form ===================== */
/* ---- sections, questions and the bits inside them slide in and out instead of jumping ---- */
function formSnapshot(mount) {

  [].forEach.call(mount.querySelectorAll('[data-anim]'), function (n) { snap.anim[n.getAttribute('data-anim')] = true; });
  [].forEach.call(mount.children, function (sec) {
    var title = sec.getAttribute('data-sec'), items = [];
    if (!title) return;
    [].forEach.call(sec.children, function (c) {
      var k = c.getAttribute('data-field-id');
      if (k) items.push({ key: k, node: c });
    });
    snap.secs.push({ title: title, node: sec, items: items });
    snap.byTitle[title] = snap.secs[snap.secs.length - 1];
  });
  return snap;
}
function slideIn(node) {
  if (calm()) return;
  node.classList.add('slide-in');
  node.addEventListener('animationend', function () { node.classList.remove('slide-in'); }, { once: true });
  setTimeout(function () { node.classList.remove('slide-in'); }, 600);
}
function slideOut(clone) {
  clone.classList.add('slide-out'); clone.setAttribute('aria-hidden', 'true');
  // the leaving copy must never be mistaken for the real question
  [clone].concat([].slice.call(clone.querySelectorAll('[data-field-id],[data-anim]'))).forEach(function (n) {
    ['data-field-id', 'data-anim'].forEach(function (a) { if (n.hasAttribute && n.hasAttribute(a)) { n.setAttribute(a + '-gone', n.getAttribute(a)); n.removeAttribute(a); } });
  });
  clone.querySelectorAll('input,textarea,button').forEach(function (n) { n.tabIndex = -1; });
  clone.addEventListener('animationend', function () { if (clone.parentNode) clone.parentNode.removeChild(clone); }, { once: true });
  setTimeout(function () { if (clone.parentNode) clone.parentNode.removeChild(clone); }, 600);
}
function animateForm(before, mount) {
  if (!before || !before.secs.length || calm()) return;
  var after = formSnapshot(mount);
  var bigChange = after.secs.filter(function (s) { return !before.byTitle[s.title]; }).length > 2;   // a whole new form: let it appear without a cascade of slides
  if (!bigChange) after.secs.forEach(function (sec) {
    var old = before.byTitle[sec.title]; if (!old) { slideIn(sec.node); return; }
    var oldKeys = {}, newKeys = {};
    old.items.forEach(function (it) { oldKeys[it.key] = it; });
    sec.items.forEach(function (it) { newKeys[it.key] = it; if (!oldKeys[it.key]) slideIn(it.node); });
    old.items.forEach(function (it, i) {
      if (newKeys[it.key]) return;
      var clone = it.node.cloneNode(true); clone.style.setProperty('--h', it.node.offsetHeight + 'px');
      var prev = null; for (var j = i - 1; j >= 0; j--) if (newKeys[old.items[j].key]) { prev = newKeys[old.items[j].key].node; break; }

}

/* ===================== output =====================
   mark=true is the live preview: anything still missing shows as a gap the tech can tap
   (written as ⟦field-id::label⟧ and drawn as a highlighted span). */
var MISS_OPEN = '⟦', MISS_CLOSE = '⟧';

/* e.g. 2026-10-02 3:45 PM (device's local time, taken when the comment is built) */

  var d = new Date();
  function p(n) { return (n < 10 ? '0' : '') + n; }
  var h = d.getHours(), ap = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + h + ':' + p(d.getMinutes()) + ' ' + ap;
}

function buildOutput(mark) {
  var m = M(mark);
  var name = getName();
  var who = name.first && name.last ? name.first + ' ' + name.last : m('tech', 'Your name');
  var title = jobKey() ? jobTitle() : (STATE.job_type ? STATE.job_type + ' — ' + m('job', 'Service') : m('job', 'Job type'));
  var lines = [who + ' - ' + title + ' - ' + stamp()];
  if (!jobKey()) return lines.join('\n');
  currentSections().forEach(function (sec) {
    var body = [];
    sec.items.filter(visible).forEach(function (c) {
      var l = c.out(m);

        l = ['Cabling: Not up to Xplore specifications - ' + (str(STATE.cabling_why) || m('cabling_why', 'Why'))];
      body = body.concat(l);

/* ===================== live comment, progress, copy ===================== */

  var pct = left === 0 ? 100 : PEAK ? Math.round((1 - left / PEAK) * 100) : 0;
  ['progress', 'bar-progress'].forEach(function (id) {
    var bar = $(id); if (!bar) return;
    bar.firstChild.style.width = pct + '%';

}

    var ea = a.id === 'tech' ? null : document.querySelector('#form-mount [data-field-id="' + a.id + '"]');
    var eb = b.id === 'tech' ? null : document.querySelector('#form-mount [data-field-id="' + b.id + '"]');
    if (a.id === 'tech') return -1;

  var copy = $('copy-btn');

  copy.className = 'btn ' + (COPY_FLASH ? 'done pop' : 'primary') + (left === 0 && !COPIED && !COPY_FLASH ? ' ready' : '');

}

    ERRORS.forEach(function (e) { PROMPT[e.id] = true; });   // checklists open their reason box
    if (ERRORS.some(function (e) { return e.id === 'light'; })) LIGHT_PROMPT = true;

/* ===================== safety net: the job in progress is saved on this phone, so a refresh or a closed tab loses nothing.

var WIP_MAX = 12 * 3600000, WIP_OFFER = false, WIP_T = null;
function wipSave() { if (WIP_OFFER || WIP_T) return; WIP_T = setTimeout(function () { WIP_T = null; wipSaveNow(); }, 300); }

function wipClear() { clearTimeout(WIP_T); WIP_T = null; store.del(WIP_KEY); }
function wipOffer() {
  // a job saved by an older version moves over once
  // a job saved by an older version (always the Fibre existing drop install) moves over once
  var FIBRE_EXISTING = { job_type: 'New Install', job_svc: 'Fibre (Existing Drop)' };
  var old = store.get(OLD_DRAFT_KEY);
  if (old) {
    try { var o = JSON.parse(old); if (hasAnswers(o) && !store.get(WIP_KEY)) store.set(WIP_KEY, JSON.stringify({ at: Date.now(), state: Object.assign(o, FIBRE_EXISTING) })); } catch (e) {}
    store.del(OLD_DRAFT_KEY);
  }
  var old1 = store.get(OLD_WIP_KEY);
  if (old1) {
    try { var o1 = JSON.parse(old1); if (o1 && hasAnswers(o1.state) && !store.get(WIP_KEY)) { o1.state = Object.assign(o1.state, FIBRE_EXISTING); store.set(WIP_KEY, JSON.stringify(o1)); } } catch (e) {}
    store.del(OLD_WIP_KEY);
  }
  var d = null;
  try { d = JSON.parse(store.get(WIP_KEY) || 'null'); } catch (e) { d = null; }
  if (!d || !hasAnswers(d.state) || !d.at || Date.now() - d.at > WIP_MAX) { wipClear(); return; }
  if (hasAnswers(STATE)) return;   // they have already started a new one
  WIP_OFFER = true;
  var mins = Math.max(1, Math.round((Date.now() - d.at) / 60000));
  var ago = mins < 60 ? mins + ' min ago' : Math.round(mins / 60) + ' hr ago';
  showToast('You have an unfinished ' + (d.state.job_type && d.state.job_svc ? d.state.job_type + ' \u2014 ' + d.state.job_svc + ' ' : '') + 'job from ' + ago + '.', 'Restore', function () {
    WIP_OFFER = false; STATE = d.state; ERRORS = []; COPIED = false; PEAK = 0; render(); updatePreview(); wipSaveNow();
  });
  showToast.onDismiss = function () { WIP_OFFER = false; wipClear(); };
}
function wipDropOffer() { if (!WIP_OFFER) return; WIP_OFFER = false; hideToast(); }   // they started fresh instead: the old job gives way

/* ===================== colour mode: Auto (follows the phone), Light or Dark, plus OLED Black ===================== */

var RETRO_ON = false, ORIG_LOGO = '', ORIG_FOOT = '';
function applyRetro(on) {
  RETRO_ON = on;
  var root = document.documentElement, logo = document.querySelector('header.app-header img'), foot = document.querySelector('.footer-text');
  fadeTheme();
  if (on) root.setAttribute('data-retro', 'on'); else root.removeAttribute('data-retro');
  if (logo) { if (!ORIG_LOGO) ORIG_LOGO = logo.src; logo.src = on ? RETRO_LOGO : ORIG_LOGO; }
  if (foot && foot.firstChild && foot.firstChild.nodeType === 3) {   // only the leading text, so the version and name links survive

function initRetro() {
